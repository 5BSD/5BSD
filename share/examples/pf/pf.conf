## Example only: every rule is commented and this file is not /etc/pf.conf.
## Review interface names and addresses before selecting rules for your system.
## See pf.conf(5); this template uses the current vendor PF grammar.
## Forwarding requires gateway_enable or ipv6_gateway_enable in rc.conf(5).
##
## External and internal interfaces, and an example RFC 5737 internal network:
#ext_if = "em0"
#int_if = "em1"
#lan = "192.0.2.0/24"
##
## Loopback is not filtered; translate outgoing IPv4 from the selected LAN.
#set skip on lo0
#match out on $ext_if inet from $lan nat-to ($ext_if)
##
## Explicit policy: block unless a following pass rule permits the traffic.
#block all
#pass out keep state
#pass in on $int_if inet from $lan to any keep state
## Permit SSH to the external interface only if this is desired:
#pass in on $ext_if inet proto tcp to ($ext_if) port 22 flags S/SA keep state
