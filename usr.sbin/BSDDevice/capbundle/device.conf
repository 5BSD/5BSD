# localdevice(8) per-label device policy (default-deny).
#
# Each entry grants ONE client label access to ONE /dev leaf (a single
# component -- no '/', no leading '.', never "..") with a set of rights.  A
# label/device pair with no entry here is refused (EACCES); with no file at all,
# the compiled-in default denies everything.
#
#   label   the connecting Component's unforgeable channel label (system.<X>)
#   device  the /dev leaf name (e.g. "null", "zero", "hda")
#   rights  any of: read write ioctl mmap seek event
#   ioctls  optional array of allowed ioctl command numbers; only meaningful
#           when "ioctl" is in rights, and it caps the delivered descriptor to
#           exactly those commands (cap_ioctls_limit(2)).
#
# The samples below grant read on the always-present pseudo-devices; replace
# them with your fleet's real device policy.

devices = [
    { label = "system.Example"; device = "null"; rights = ["read", "write"]; },
    { label = "system.Example"; device = "zero"; rights = ["read"]; },
]
