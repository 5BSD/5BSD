# LogCmp ingestion tuning.  Values are validated before capability mode.
ring_size = 262144;
fallback_drain_ms = 1000;

# Append-only segment rotation threshold (64 KiB through 1 GiB).
segment_size = 16777216;

# Retain at most this many completed segments in addition to the active one.
max_segments = 64;

# Persist and forward all defined severities by default.  Values are 1..24.
minimum_severity = "trace";

# Per-session fixed-window ingestion budget.  Set both to zero to
# disable limiting; setting only one to zero is rejected.
rate_limit_interval_ms = 30000;
rate_limit_burst = 10000;

# Fixed event-driven ingress pool.  Sessions are distributed across these
# shards; no process or internal storage ring is allocated per client.
ingress_shards = 4;
max_sessions = 65536;
drain_batch = 256;
