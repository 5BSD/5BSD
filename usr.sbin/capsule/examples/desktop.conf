# /etc/capsule.conf — Desktop profile
#
# Example with no additional resource or system-gate claims.
# Mandatory kernel protections and software admission rules still apply.
# This example is not a complete BIP policy.
#
# To harden specific areas, uncomment claims below or switch
# to the server or embedded profile.

integrity {
    ptrace = true;
    signal = true;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

# No additional policy claims.
# claims { }
