# /etc/capsule.conf - Embedded / Appliance profile
#
# Example claims for appliances and embedded devices.
# Reboot, module changes and kenv writes require capability tokens.
# Privileged ports are claimed. This example is not a complete BIP policy.
#
# Services that need these capabilities must declare them in
# their .cap bundles and receive tokens from Capsule.

integrity {
    ptrace = true;
    signal = true;
    visible = true;
    wait = true;
    sched = true;
    core = true;
    ktrace = true;
}

claims {
    # All privileged ports
    network = [
        {
            port = "<1024";
            protocol = "*";
            direction = "bind";
            domain = "*";
        },
    ];

    # The selected system operations require tokens.
    system = [
        "reboot",
        "kldload",
        "kldunload",
        "kenv",
    ];
}
