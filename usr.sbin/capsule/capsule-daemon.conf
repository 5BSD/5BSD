# 5BSD Capsule configuration template.
# Normal: /etc/capsule.conf. BIP PID 1: immutable /boot/capsule.conf.
#
# Capsule claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# Capsule retains what it already has.
#
# See docs/book/src/compat/bsd-side.md for a full production config.

# First managed process.  Override with capsule -b for alternate
# bootstraps.
# service_manager = "/usr/libexec/switchboard";

integrity {
    ptrace = true;
    # Mandatory: signal, sigkill, and sigcont are always true.
    signal = true;
    sigkill = true;
    sigcont = true;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

# Boot storage grants are installation inputs: exact recipient, pool/dataset
# identities, backing devices and explicit operation rights. An empty list
# grants no persistent storage. See capsule.conf(5); do not copy fixture GUIDs.
storage = [];

claims {
    # Resources are normally claimed dynamically when a service requests
    # them.  Uncomment a list for persistent boot-time claims.
    # system = [
    #     "kldload",
    #     "kldunload",
    #     "reboot",
    #     "kenv",
    # ];
}

# Explicit base-system policy. Empty disables Crypto bootstrap authority.
# The recipient must remain a verified system Core unit.
crypto_recipient = "system.Crypto/bsdcrypto";
