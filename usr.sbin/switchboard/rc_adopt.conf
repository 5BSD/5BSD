# switchboard rc.d adoption list
#
# switchboard natively supervises the rc.d services named here as supervised
# SVC_KIND_RC units (management=system, restart=on-failure); /etc/rc keeps
# starting every other rc.d service.  This file -- not a hardcoded list in
# switchboard -- is the authority for which legacy rc.d services are adopted.
#
# Format: one rc.d service name per line (the basename under /etc/rc.d, e.g.
# "cron").  Blank lines are ignored and '#' begins a comment.  A name that is
# not present under the rc.d directory is simply not adopted (never an error).
#
# Under mac_veriexec the /Capabilities tree is integrity-protected, so this
# list is tamper-evident.  Add a service name on its own line (e.g. sshd, ntpd)
# to widen adoption; remove one to stop supervising it.
cron
