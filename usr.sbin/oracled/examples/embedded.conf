# /etc/oracled.conf — Embedded / Appliance profile
#
# Locked-down configuration for appliances and embedded devices.
# All system operations are gated — no process can reboot, load
# kernel modules, or modify boot environment variables without
# an authorized capability token.  All privileged ports and
# sensitive paths are claimed.
#
# Services that need these capabilities must declare them in
# their manifests and receive tokens from the Oracle.

# manifest_dir = "/etc/serviced.d";

integrity {
    ptrace = true;
    signal = true;
    visible = true;
    wait = true;
    sched = true;
    core = true;
    ktrace = true;
}

claims {
    paths = [
        # Kernel memory
        "/dev/mem",
        "/dev/kmem",

        # Oracle config
        "/etc/oracled.conf",
        "/etc/serviced.d",

        # Credentials
        "/etc/master.passwd",

        # Boot configuration — prevent unauthorized boot env changes
        "/boot/loader.conf",
        "/boot/loader.conf.local",
    ];

    network = [
        # All privileged ports
        {
            port = ".<1024";
            protocol = "*";
            direction = "bind";
            domain = "*";
        },
    ];

    # All sensitive system operations require tokens.
    system = [
        "reboot",
        "kldload",
        "kldunload",
        "kenv",
    ];
}
