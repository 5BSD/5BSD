# /etc/oracled.conf - Bluetooth capability broker profile
#
# Demonstrates the AF_BLUETOOTH reservation grammar at the oracled
# layer.  The canonical, nonce-scoped reservation is provisioned via
# skyblued's serviced manifest (see share/examples/libcapbundle/
# skyblued.ucl): the manifest's Bluetooth network capability is minted
# to skyblued's nonce, which is what lets skyblued -- and only skyblued
# -- pass the block-all socket() gate.
#
# A claims.network entry here is applied under OracleD's own nonce, so
# it reserves the domain to OracleD, not to a service.  Use it only for
# a belt-and-suspenders coarse block (e.g. deny all Bluetooth on a host
# that runs no broker); to grant the radio to skyblued, provision the
# manifest above instead.

integrity {
    ptrace = true;
    signal = true;
    visible = true;
    wait = true;
    sched = true;
    core = true;
    ktrace = true;
}

claims {
    # Fully-wildcard AF_BLUETOOTH reservation.  domain = bluetooth maps
    # to AF_BLUETOOTH; protocol/address "any" and direction "any" form
    # the exact wildcard the kernel's block-all gate keys on, covering
    # HCI, L2CAP, RFCOMM, SCO and ISO in one claim.
    network = [
        {
            domain = "bluetooth";
            protocol = "any";
            address = "*";
            direction = "any";
        },
    ];
}
