# /etc/oracled.conf — Server profile
#
# Configuration for multi-tenant servers.  Kernel module loading
# is gated so that unprivileged services cannot modify the running
# kernel.  Privileged ports and sensitive device nodes are claimed
# so that only authorized services can use them.
#
# Reboot is NOT gated — administrators can reboot directly.
# Use the embedded profile if reboot control is also required.

# manifest_dir = "/etc/serviced.d";

integrity {
    ptrace = true;
    signal = true;
    visible = true;
    wait = true;
    sched = true;
    core = true;
    ktrace = true;
}

claims {
    # Kernel memory — nothing legitimate uses these
    # Oracle's own config — prevent tampering while running
    # Credentials — prevent live modification
    paths = [
        "/dev/mem",
        "/dev/kmem",
        "/etc/oracled.conf",
        "/etc/serviced.d",
        "/etc/master.passwd",
    ];

    # Privileged ports — services must request tokens to bind
    network = [
        {
            port = ".<1024";
            protocol = "*";
            direction = "bind";
            domain = "*";
        },
    ];

    # Kernel module loading requires a token from kldmgrd.
    # Reboot is left ungated for admin use.
    system = [
        "kldload",
        "kldunload",
    ];
}
