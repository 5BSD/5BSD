# /etc/oracled.conf — 5BSD default hardened configuration
#
# OracleD claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# OracleD retains what it already has.
#
# If you don't want a service to have unrestricted access,
# start it after the Oracle.
#
# See oracled(8) and hardening.md for details.

integrity {
    ptrace = true;
    signal = false;         # leave signalable for rc(8)
    visible = false;        # leave visible for ps/top
    wait = true;
    sched = true;
    core = false;           # allow core dumps for debugging
    ktrace = true;
}

claims {
    paths = [
        # Kernel memory
        "/dev/mem",
        "/dev/kmem",

        # Boot chain
        "/boot",

        # System binaries
        "/usr/sbin",
        "/usr/libexec",

        # Credentials and configuration
        "/etc/master.passwd",
        "/etc/passwd",
        "/etc/group",
        "/etc/login.conf",
        "/etc/rc.conf",
        "/etc/rc.d",
        "/etc/ssh",
        "/etc/pam.d",
        "/etc/oracled.conf",
        "/etc/oracled.d",

        # Audit trail
        "/var/log",

        # Root home
        "/root",
    ];

    network = [
        { port = 22;  protocol = "tcp"; direction = "bind"; },
        { port = 53;  protocol = "tcp"; direction = "bind"; },
        { port = 53;  protocol = "udp"; direction = "bind"; },
        { port = 80;  protocol = "tcp"; direction = "bind"; },
        { port = 443; protocol = "tcp"; direction = "bind"; },
    ];

    system = [
        "kldload",
        "kldunload",
        "reboot",
        "kenv",
        "sysctl",
        "audit",
        "acct",
        "swapon",
        "swapoff",
    ];
}
