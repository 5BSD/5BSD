# /etc/oracled.conf - 5BSD OracleD configuration
#
# OracleD claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# OracleD retains what it already has.
#
# See docs/hardening.md for a full production config.

# Legacy manifest directory used by oraclectl verify.  serviced launches
# capability bundles from /Capabilities/System and /Capabilities.
# manifest_dir = "/etc/serviced.d";

# First managed process.  Override with oracled -b for alternate
# bootstraps.
# service_manager = "/usr/libexec/serviced";

integrity {
    ptrace = true;
    signal = false;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

claims {
    # Kernel memory - nothing legitimate uses these
    # Oracle's own config - prevent tampering while running
    # Credentials - prevent live modification
    paths = [
        "/dev/mem",
        "/dev/kmem",
        "/etc/oracled.conf",
        "/etc/master.passwd",
    ];

    # System operations are normally claimed dynamically when a service
    # requests them.  Uncomment for persistent boot-time claims.
    # system = [
    #     "kldload",
    #     "kldunload",
    #     "reboot",
    #     "kenv",
    # ];
}
