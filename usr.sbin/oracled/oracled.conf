# /etc/oracled.conf - 5BSD Oracled authority configuration
#
# Oracled claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# Oracled retains what it already has.
#
# See docs/hardening.md for a full production config.

# First managed process.  Override with oracled -b for alternate
# bootstraps.
# service_manager = "/usr/libexec/serviced";

integrity {
    ptrace = true;
    # Mandatory: signal, sigkill, and sigcont are always true.
    signal = true;
    sigkill = true;
    sigcont = true;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

claims {
    # Resources are normally claimed dynamically when a service requests
    # them.  Uncomment a list for persistent boot-time claims.
    # paths = [
    #     "/dev/mem",
    #     "/dev/kmem",
    # ];
    # system = [
    #     "kldload",
    #     "kldunload",
    #     "reboot",
    #     "kenv",
    # ];
}
