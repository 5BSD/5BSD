# /etc/oracled.conf — oracled(8) configuration
#
# All settings have sane defaults.  This file is optional —
# oracled runs with built-in defaults if it does not exist.
# Syntax errors are fatal.

# Daemon paths.
# pidfile = "/var/run/oracled.pid";
# control_socket = "/var/run/oracled.sock";
# control_socket_mode = "0700";

# Capability shield flags.
#
# Each flag blocks a specific external interaction from foreign
# nonces (processes outside oracled's fork family).  Set to true
# to enable, false to disable.
#
# Flags that default to false are disabled because enabling them
# can interfere with system administration tools.
shield {
    ptrace = true;          # block debugger attach
    signal = false;         # block signals (breaks rc stop/status)
    visible = false;        # hide from ps/top/procfs
    wait = true;            # block wait4 status scraping
    sched = true;           # block priority/affinity manipulation
    core = false;           # suppress core dumps
    ktrace = true;          # block passive syscall tracing
}

# Device isolation.
isolation {
    cap_rt = true;          # claim /dev/cap_rt exclusively
}
