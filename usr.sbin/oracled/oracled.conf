# /etc/oracled.conf — oracled(8) configuration
#
# All settings have sane defaults.  This file is optional —
# oracled runs with built-in defaults if it does not exist.
# Syntax errors are fatal.

# Daemon paths.
# pidfile = "/var/run/oracled.pid";
# control_socket = "/var/run/oracled.sock";
# control_socket_mode = "0700";

# Integrity — capprotect flags for oracled itself.
#
# Each flag blocks a specific external interaction from foreign
# nonces (processes outside oracled's fork family).
#
# Flags that default to false are disabled because enabling them
# can interfere with system administration tools.
integrity {
    ptrace = true;          # block debugger attach
    signal = false;         # block signals (breaks rc stop/status)
    visible = false;        # hide from ps/top/procfs
    wait = true;            # block wait4 status scraping
    sched = true;           # block priority/affinity manipulation
    core = false;           # suppress core dumps
    ktrace = true;          # block passive syscall tracing
}

# Claims — resources under oracle control.
#
# Resources listed here are claimed exclusively by oracled at
# boot via the cap_rt isolation service.  Once claimed, MACF
# hooks deny access from all other processes — including root.
#
# /dev/cap_rt is always claimed automatically.
#
# Agents that need access to claimed resources declare them in
# their manifest.  oracled mints isolation tokens and passes
# them to the agent before exec.
# claims {
#     paths = [
#         "/dev/mem",
#         "/dev/kmem",
#         "/boot/kernel",
#     ];
#     network = [
#         { port = 22;  protocol = "tcp"; direction = "bind"; },
#         { port = 80;  protocol = "tcp"; direction = "bind"; },
#         { port = 443; protocol = "tcp"; direction = "bind"; },
#     ];
#
#     # System operations to gate.  Even root is denied unless
#     # holding an authorized token from oracled.
#     # Available: kldload, kldunload, kldstat, reboot, swapon,
#     #            swapoff, sysctl, kenv, acct, audit, kenv_read
#     # system = ["kldload", "kldunload", "reboot", "kenv"];
# }
