# /etc/oracled.conf — 5BSD OracleD configuration
#
# OracleD claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# OracleD retains what it already has.
#
# See docs/hardening.md for a full production config.

# Service manifests are loaded from this directory.
# Each *.ucl file declares a service to launch.
# manifest_dir = "/etc/serviced.d";

integrity {
    ptrace = true;
    signal = false;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

claims {
    paths = [
        # Kernel memory — nothing legitimate uses these
        "/dev/mem",
        "/dev/kmem",

        # Oracle's own config — prevent tampering while running
        "/etc/oracled.conf",
        "/etc/serviced.d",

        # Credentials — prevent live modification
        "/etc/master.passwd",
    ];

    # System operations — uncomment when cap_rt_system module
    # is loaded (add cap_rt_system_load="YES" to loader.conf).
    # system = [
    #     "kldload",
    #     "kldunload",
    #     "reboot",
    #     "kenv",
    # ];
}
