# /etc/oracled.conf — 5BSD OracleD configuration
#
# OracleD claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# OracleD retains what it already has.
#
# IMPORTANT: The default ships with minimal claims suitable for
# development.  See docs/hardening.md for a production config
# that locks down the system.

integrity {
    ptrace = true;
    signal = false;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

