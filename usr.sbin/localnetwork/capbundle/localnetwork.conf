# Per-client network policy for the system.Network provider, keyed by the
# immutable serviced manifest label.  `default` applies to any label without
# a clients{} entry; a clients{} entry names only the dimensions it overrides
# and inherits the rest from default.  A malformed file is ignored with a
# warning and the compiled-in default policy (identical to the block below)
# stays in force.  SERVICE_RIGHTS_ADMIN sessions bypass this table.
default {
	resolve = true;
	connect = true;
	udp = true;
	inet4 = true;
	inet6 = true;
	internal = false;
}
# Example: deny outbound TCP to one component, or grant another the internal
# (loopback/link-local/private-range) reach that is denied by default:
#
#	clients {
#		"org.example.render" { connect = false; udp = false; }
#		"org.example.metrics" { internal = true; }
#	}
clients {
};
