# /etc/authorityd.conf - 5BSD Authorityd authority configuration
#
# Authorityd claims resources at boot.  Claims are forward-looking:
# they control all FUTURE access.  Anything that started before
# Authorityd retains what it already has.
#
# See docs/hardening.md for a full production config.

# First managed process.  Override with authorityd -b for alternate
# bootstraps.
# service_manager = "/usr/libexec/serviced";

integrity {
    ptrace = true;
    # Mandatory: signal, sigkill, and sigcont are always true.
    signal = true;
    sigkill = true;
    sigcont = true;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

claims {
    # Resources are normally claimed dynamically when a service requests
    # them.  Uncomment a list for persistent boot-time claims.
    # system = [
    #     "kldload",
    #     "kldunload",
    #     "reboot",
    #     "kenv",
    # ];
}
