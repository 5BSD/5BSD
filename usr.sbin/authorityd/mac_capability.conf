# Preload the mac_capability policy stack for the capability plane.
#
# Authority runs as PID 1 and requires /dev/mac_capability at startup; the
# plane's components mint and inherit capability channels through it.  Without
# these modules the device is absent, authority-init cannot start, and the
# kernel falls through init_path to stock /sbin/init (no plane).  This snippet
# ships with the authorityd package so that installing the plane also arranges
# to load the policy it depends on.  mac_capability pulls in its own module
# dependencies (channel, node, coalition), but the outward-facing policies are
# listed explicitly so the set is auditable.
mac_capability_load="YES"
mac_capability_mount_load="YES"
mac_capability_identity_load="YES"
mac_capability_isolation_load="YES"
mac_capability_capprotect_load="YES"
mac_capability_accounting_load="YES"
mac_capability_system_load="YES"
