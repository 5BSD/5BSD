# /etc/authorityd.conf — Desktop profile
#
# Permissive configuration for workstation use.  No resources are
# claimed and no system gates are activated.  Everything works
# exactly like stock FreeBSD.  AuthorityD runs only for integrity
# protection of its own process and to supervise serviced.
#
# To harden specific areas, uncomment claims below or switch
# to the server or embedded profile.

integrity {
    ptrace = true;
    signal = false;
    visible = false;
    wait = true;
    sched = true;
    core = false;
    ktrace = true;
}

# No claims — everything is open.
# claims { }
