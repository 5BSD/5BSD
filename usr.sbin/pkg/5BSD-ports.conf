# Packages built from https://github.com/5BSD/5BSD-ports.
# Publish the matching native catalogue here; no public package service exists.
# A Git source repository is not a pkg catalogue. To use a signed remote
# catalogue, override URL and signature settings in
# /usr/local/etc/pkg/repos/5BSD-ports.conf.
#
# 5BSD-ports takes precedence over FreeBSD-ports (priority 0): where both
# provide a package, pkg chooses the 5BSD build for a new installation, and
# an installed 5BSD-ports package keeps upgrading from 5BSD-ports.  An
# explicit "-r FreeBSD-ports" bypasses both; lock 5BSD-ports packages first
# (see the Upgrading chapter of the 5BSD book).
5BSD-ports: {
  url: "file:///usr/5bsd-packages/ports",
  priority: 100,
  enabled: yes
}
