# bsdnotify(8) policy.  Three optional top-level blocks; any other key is a
# hard error.  A missing block takes the compiled-in default shown here, so
# this file states the defaults explicitly rather than changing them.
#
# Topic lists accept exact topics ("system.shutdown.now"), prefix patterns
# ("user.*" matches "user.x" and "user.x.y", not "user"), or a bare "*".
# A bare "*" must be the only entry in its list.
#
# The tier a session is on is decided by the endpoint it connected to, never
# by the client: "system.Notify" is the open tier, "system.Notify.System" the
# gated tier that switchboard only resolves for callers anointed with
# "system.notify.system".  A session holding SERVICE_RIGHTS_ADMIN (an
# ambient root login session) bypasses policy on either tier.

# Open tier: every session may reach system.Notify.  It may subscribe to
# anything and publish only under user.*; no timers, no state under system.*.
default {
	subscribe = [ "*" ];
	publish = [ "user.*" ];
	timers = false;
}

# Gated tier: the policy for a system.Notify.System session whose label has
# no clients{} entry below.  Publish anything (including state), timers.
system_default {
	publish = [ "*" ];
	subscribe = [ "*" ];
	timers = true;
}

# Per-label narrowing of the GATED tier, keyed by the immutable switchboard
# manifest label.  An entry replaces system_default for that label on
# system.Notify.System only; it is never consulted for a session on the open
# tier.  Example:
#
#	clients {
#		"com.example/publisher" {
#			publish = [ "system.shutdown.*" ];
#			subscribe = [ "*" ];
#			timers = true;
#		}
#	}
clients {
};
