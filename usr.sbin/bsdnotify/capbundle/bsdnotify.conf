# NotifyCmp authority is granted by the administrator and keyed by the
# immutable serviced manifest label.  Undeclared labels are default-deny.
clients {
    "org.5bsd.system.reboot/rebootd" {
        publish = [
            "system.shutdown.requested",
            "system.shutdown.scheduled",
            "system.shutdown.imminent",
            "system.shutdown.cancelled"
        ];
    }
};
