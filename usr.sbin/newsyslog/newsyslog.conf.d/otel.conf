# OpenTelemetry file target (otel.conf(5) export.target = "file"): one
# OTLP JSON Lines file per program.  B: no rotation message (it would
# not be JSON).  The services' writers reopen their file on SIGHUP,
# sent to the daemon(8) child pid file; newsyslog waits before
# compressing.  dtrace(1) runs without a pid file and notices the new
# file by itself within a second; its rotated files stay uncompressed.
#
# logfilename				[owner:group]	mode count size when  flags [/pid_file] [sig_num]
/var/log/otel/hwstat.jsonl		_otel:_otel	640  7	   10240 *     BJ    /var/run/otel/otel_hwstat.child.pid
/var/log/otel/otelpfd.jsonl		_otel:_otel	640  7	   10240 *     BJ    /var/run/otel/otelpfd.child.pid
/var/log/otel/otelauditd.jsonl		_otel:_otel	640  7	   10240 *     BJ    /var/run/otel/otelauditd.child.pid
/var/log/otel/bsdinstruments.jsonl	_otel:_otel	640  7	   10240 *     BJ    /var/run/otel/otel_dtrace.child.pid
/var/log/otel/dtrace.jsonl		_otel:_otel	640  7	   10240 *     BN
