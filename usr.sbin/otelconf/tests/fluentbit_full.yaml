# Generated by otelconf(8) from otel.conf(5); do not edit.
# Regenerated by the fluentbit rc.d script on every start.
service:
  flush: 1
  grace: 5
  daemon: off
  log_level: info
  http_server: off
  storage.path: '/var/spool/otel/fluent-bit'
  storage.sync: normal
  storage.checksum: on
  storage.backlog.mem_limit: 16M
  storage.max_chunks_up: 64
  storage.delete_irrecoverable_chunks: on

pipeline:
  inputs:
    # OTLP/HTTP receiver for the base system emitters.
    - name: opentelemetry
      listen: '127.0.0.1'
      port: 4318
      storage.type: filesystem
    # Text logs (otel.conf agent.tail).
    - name: tail
      tag: host.logs
      path: '/var/log/messages,/var/log/daemon.log'
      db: '/var/spool/otel/fluent-bit/tail.db'
      read_from_head: false
      skip_long_lines: on
      storage.type: filesystem

  outputs:
    - name: opentelemetry
      match: '*'
      host: 'collector.example'
      port: 4318
      metrics_uri: '/otlp/v1/metrics'
      logs_uri: '/otlp/v1/logs'
      traces_uri: '/otlp/v1/traces'
      tls: on
      tls.verify: on
      compress: gzip
      retry_limit: no_limits
      storage.total_limit_size: 256M
      header:
        - 'Authorization Bearer it''s'
        - 'X-Scope-OrgID t1'
