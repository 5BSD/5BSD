# Local OpenTelemetry settings.  Keys set here override
# /etc/defaults/otel.conf; see otel.conf(5) for every key.
#
# Typical changes:
#
# endpoint = "https://collector.example.org:4318";
# headers_file = "/etc/otel/collector.headers";
#
# or, without a collector, files under /var/log/otel:
#
# export { target = "file"; }
#
# resource {
#	"deployment.environment.name" = "staging";
# }
