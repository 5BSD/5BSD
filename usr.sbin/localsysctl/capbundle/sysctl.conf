# Per-client sysctl policy for the system.Sysctl provider, keyed by the
# immutable serviced manifest label.  `default` applies to any label without a
# clients{} entry.  read/write are lists of sysctl name prefixes (dotted-path,
# matched on a component boundary); a name is permitted if it equals or is under
# a listed prefix.  Writes are denied unless listed.  A malformed file is
# ignored with a warning and the compiled-in default (a small safe read set, no
# writes) stays in force.
default {
	read = [
		"kern.ostype", "kern.osrelease", "kern.osreldate",
		"kern.version", "kern.hostname", "hw.machine",
		"hw.ncpu", "hw.physmem"
	];
	write = [];
}
# Example: grant one component broad kern/hw reads and let it tune a subtree.
#
#	clients {
#		"org.example.telemetry" { read = ["kern", "hw", "vm.stats"]; }
#		"org.example.tuner" { read = ["net.inet"]; write = ["net.inet.tcp"]; }
#	}
