# BSDTime per-label clock-write policy.  Reading the clock is never gated;
# `set` grants a label authority to STEP (clock_settime) and SLEW (adjtime).
# Default-deny: no label may move the clock unless listed here.  Grant it only
# to a trusted time source (e.g. an NTP daemon's label).
default { set = false; }
clients {
	# "org.5bsd.ntp" { set = true; }
}
