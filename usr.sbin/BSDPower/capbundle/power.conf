# BSDPower per-label suspend policy.  Reading supported sleep states is never
# gated; `suspend` grants a label authority to put the machine to sleep
# (ACPI SUSPEND).  Default-deny: no label may suspend unless listed here.
default { suspend = false; }
clients {
	# "org.5bsd.powerd" { suspend = true; }
}

# Optional suspend inhibition is separate from suspend authority, default deny.
# clients { "org.example.updater" { inhibit = true; } }
