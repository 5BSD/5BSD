# BSD ncurses ABI/build policy; upstream versions come from dist.mk.
NCURSES_OSPEED=short
NCURSES_SP_FUNCS=1
NCURSES_WRAP_PREFIX=_nc_
BROKEN_LINKER=0
NCURSES_USE_DATABASE=1
NCURSES_USE_TERMCAP=1
NCURSES_CONST=const
NCURSES_TPARM_VARARGS=1
NCURSES_SBOOL=char
NCURSES_XNAMES=1
NCURSES_EXT_COLORS=1
HAVE_TERMIOS_H=1
HAVE_TERMIO_H=0
HAVE_TCGETATTR=1
cf_cv_enable_reentrant=0
HAVE_VSSCANF=1
HAVE_STDINT_H=1
HAVE_STDNORETURN_H=0
NCURSES_CH_T=cchar_t
NCURSES_EXT_FUNCS=1
NCURSES_INLINE=inline
NCURSES_LIBUTF8=0
NCURSES_MBSTATE_T=0
NCURSES_MOUSE_VERSION=2
NCURSES_OK_WCHAR_T=1
NCURSES_OPAQUE=0
NCURSES_OPAQUE_FORM=0
NCURSES_OPAQUE_MENU=0
NCURSES_OPAQUE_PANEL=0
NCURSES_RGB_COLORS=0
NCURSES_SIZE_T=short
NCURSES_WATTR_MACROS=1
NCURSES_WCHAR_T=0
NCURSES_WCWIDTH_GRAPHICS=1
NCURSES_WINT_T=0
NCURSES_INTEROP_FUNCS=1
NCURSES_TPARM_ARG=intptr_t
NEED_WCHAR_H=1
USE_CXX_BOOL=defined(__cplusplus)
USE_STDBOOL_H=1
cf_cv_1UL=1U
USE_BUILTIN_BOOL=1
cf_cv_enable_lp64=1
cf_cv_enable_opaque=NCURSES_OPAQUE
cf_cv_enable_sigwinch=1
cf_cv_type_of_bool=unsigned char
cf_cv_typeof_chtype=uint32_t
cf_cv_typeof_mmask_t=uint32_t
GENERATED_EXT_FUNCS=generated
NCURSES_CCHARW_MAX=5

# Base manual installation locations and command names.
TERMINFO=/usr/share/misc/terminfo
DATADIR=/usr/share
TPUT=tput
TSET=tset
RESET=reset
CLEAR=clear
TABS=tabs
TIC=tic
TOE=toe
INFOCMP=infocmp
CAPTOINFO=captoinfo
INFOTOCAP=infotocap
