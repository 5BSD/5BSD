#! /bin/sh

# Build OCI container image with almost all packages suitable for jails,
# excluding toolchain.

OCI_BASE_IMAGE=runtime

oci_image_build() {
	set_cmd ${workdir} /bin/sh
	install_packages ${abi} ${workdir} \
		5BSD-bmake \
		5BSD-dma \
		5BSD-inetd \
		5BSD-ipf \
		5BSD-ipfw \
		5BSD-natd \
		5BSD-netmap \
		5BSD-pf \
		5BSD-ssh \
		5BSD-telnet \
		5BSD-xz \
		5BSD-zfs \
		5BSD-set-minimal-jail
}

