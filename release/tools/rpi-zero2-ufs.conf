# SPDX-License-Identifier: BSD-2-Clause
# Zero 2 W: pkgbase built with KERNCONF=GENERIC-RPI, UFS root, u-boot-rpi-arm64.
# Separate boot assets and UFS keep this profile suitable for the 512 MiB board.
RPI_PARTSCHEME=mbr
RPI_ROOTLABEL=ufs
VMFS=ufs
IMAGE_HOSTNAME=5bsd-zero2
RPI_BOARD=rpi-zero2
RPI_DTB=bcm2710-rpi-zero-2-w.dtb
RPI_BOOT_FILES="bootcode.bin start.elf fixup.dat"
RPI_WIFI_DTS=5bsd-zero2-wifi.dts
RPI_ARMSTUB=
RPI_FAT_LABEL=5BSD_ZERO2
. "${RPI_TOOLS_DIR:-${scriptdir}/../tools}/rpi.subr"

# The older Pi boot firmware needs a FAT partition in the MBR. The UFS
# filesystem sits inside a FreeBSD slice with a BSD label, as in arm.subr.
vm_create_disk()
{
	local bootfiles esp slice esp_fstab result
	bootfiles="$(env TARGET=${TARGET} TARGET_ARCH=${TARGET_ARCH} \
	    WITH_UNIFIED_OBJDIR=yes make -C "${WORLDDIR}/stand" -V .OBJDIR)" || return 1
	bootfiles=$(realpath "$bootfiles") || return 1
	esp=$(mktemp /tmp/zero2-esp.XXXXXX) || return 1
	if ! make_esp_file "$esp" 0 "$bootfiles/efi/loader_lua/loader_lua.efi"; then
		rm -f "$esp"
		return 1
	fi
	slice=$(mktemp /tmp/zero2-root.XXXXXX) || { rm -f "$esp"; return 1; }
	mkdir -p "${DESTDIR}/boot/efi" || return 1
	esp_fstab="/dev/msdosfs/${RPI_FAT_LABEL}	/boot/efi       msdosfs     rw      2       2"
	if ! grep -Fqx "$esp_fstab" "${DESTDIR}/etc/fstab"; then
		echo "$esp_fstab" >> "${DESTDIR}/etc/fstab"
	fi
	touch "${DESTDIR}/firstboot" || return 1
	metalog_add_data ./firstboot || return 1
	MAKEFSARGS="-s ${VMSIZE} -D -B little"
	result=0
	buildfs && rpi_zero2_partition "$esp" "$slice" || result=1
	rm -f "$esp" "$slice"
	return "$result"
}

rpi_zero2_partition()
{
	${MKIMG} -s bsd -f raw -p "freebsd-ufs:=${VMBASE}:64K" -o "$2" || return 1
	${MKIMG} -s mbr -f "${VMFORMAT}" -a 1 \
	    -p "fat32lba:=$1:1M" -p "freebsd:=$2" -o "$VMIMAGE"
}
