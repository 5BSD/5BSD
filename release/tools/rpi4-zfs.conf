# mk-vmimage.sh profile: Pi 4 firmware/FAT boot and pkgbase ZFS root.
# RPI_FIRMWARE_DIR and RPI_UBOOT_DIR must contain unpacked FreeBSD ports assets.
TARGET=arm64
TARGET_ARCH=aarch64
VMFS=zfs
PARTSCHEME=gpt
NOSWAP=yes
WITHOUT_QEMU=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_KERNEL_SYMBOLS=yes
IMAGE_HOSTNAME=5bsd-rpi4

vm_extra_install_base()
{
	[ -z "${NOPKGBASE}" ] || {
		echo "rpi4-zfs requires pkgbase" >&2
		return 1
	}
	# The generic VM profile selects x86 comconsole; it is absent on ARM64.
	sed -i '' '/^console=/d' "${DESTDIR}/boot/loader.conf"
	{
		echo 'console="efi"'
		echo 'zfs_load="YES"'
		echo 'vfs.root.mountfrom="zfs:zroot/ROOT/default"'
	} >> "${DESTDIR}/boot/loader.conf"
	{
		echo 'ifconfig_DEFAULT="DHCP inet6 accept_rtadv"'
		echo 'zpool_upgrade=""'
	} >> "${DESTDIR}/etc/rc.conf"
	metalog_add_data ./boot/loader.conf
	metalog_add_data ./etc/rc.conf
}

# Override the ordinary VM ESP builder with Pi firmware + U-Boot + EFI loader.
make_esp_file()
{
	local output loader fat file
	output=$1
	loader=$3
	: "${RPI_FIRMWARE_DIR:?set RPI_FIRMWARE_DIR}"
	: "${RPI_UBOOT_DIR:?set RPI_UBOOT_DIR}"
	fat=$(mktemp -d /tmp/5bsd-rpi4-fat.XXXXXX)
	mkdir -p "$fat/EFI/BOOT" "$fat/overlays"
	for file in start4.elf fixup4.dat armstub8-gic.bin bcm2711-rpi-4-b.dtb LICENCE.broadcom; do
		cp "${RPI_FIRMWARE_DIR}/$file" "$fat/" || return 1
	done
	for file in mmc.dtbo disable-bt.dtbo; do
		cp "${RPI_FIRMWARE_DIR}/overlays/$file" "$fat/overlays/" || return 1
	done
	cp "${RPI_UBOOT_DIR}/u-boot.bin" "$fat/" || return 1
	cp "$loader" "$fat/EFI/BOOT/bootaa64.efi" || return 1
	printf '%s\n' '[all]' 'arm_64bit=1' 'enable_uart=1' \
	    'kernel=u-boot.bin' 'armstub=armstub8-gic.bin' \
	    'device_tree_address=0x4000' 'dtoverlay=mmc' \
	    'dtoverlay=disable-bt' > "$fat/config.txt"
	${MAKEFS} -t msdos -s 134217728 -o fat_type=32 \
	    -o sectors_per_cluster=1 \
	    -o volume_label=5BSD_RPI4 "$output" "$fat"
	# Keep the small firmware staging directory for build provenance.
}
