# Native packages built from https://github.com/5BSD/5BSD-ports.git.
# Populate this catalogue explicitly; never substitute upstream kernel modules.
release: {
  url: "file:///usr/5bsd-packages/ports",
  enabled: yes
}
release-kmods: {
  url: "pkg+http://pkg.FreeBSD.org/${ABI}/kmods_latest",
  mirror_type: "srv",
  signature_type: "fingerprints",
  fingerprints: "/usr/share/keys/pkg",
  enabled: no
}
