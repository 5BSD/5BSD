    values: ["20"]
  - id: soak-optional-reset-validation-interval
    profiles: [soak]
    variable: VIRTIO_RESET_SOAK_VERIFY_EVERY
    selector:
      DEVICES: "input gpu mem pmem sound fs"
    values: ["5"]
  - id: soak-fs-ring-format
    profiles: [soak]
    variable: FS_PACKED
    selector:
      DEVICES: "input gpu mem pmem sound fs"
    values: ["yes"]
  - id: soak-fs-queue-count
    profiles: [soak]
    variable: FS_QUEUES
    selector:
      DEVICES: "input gpu mem pmem sound fs"
    values: ["8"]
  - id: soak-iommu-reset-iterations
    profiles: [soak]
    variable: VIRTIO_RESET_SOAK_ITERATIONS
    selector:
      DEVICES: "net rng block"
      VIRTIO_IOMMU: "yes"
    values: ["20"]
  - id: soak-iommu-reset-validation-interval
    profiles: [soak]
    variable: VIRTIO_RESET_SOAK_VERIFY_EVERY
    selector:
      DEVICES: "net rng block"
      VIRTIO_IOMMU: "yes"
    values: ["5"]

cases:
  # This gate is deliberately first and exclusive.  A failure prevents every
  # expensive VM case from starting.
  - id: host-regression
    executor: host-regression
    profiles: [release, soak, soak-smoke, nested, nested-default, audio, checkpoint-audio]
    timeout: 1800
    exclusive: true
    gate: true
    resources: [compiler]

  # Compile the real 5BSD guest drivers before accepting any live feature
  # evidence.  The live image remains a separate activation requirement.
  - id: fivebsd-module-build
    executor: fivebsd-module-build
    profiles: [vmfree, smoke, release, soak, soak-smoke, nested, audio, checkpoint-audio]
    timeout: 900
    exclusive: true
    gate: true
    resources: [compiler]

  - id: fivebsd-prototype-module-build
    executor: fivebsd-module-build
    profiles: [unsupported-5bsd-prototypes]
    timeout: 900
    exclusive: true
    gate: true
    resources: [compiler]
    env:
      FIVEBSD_MODULE_SET: prototype

  # The kernel VMM gate owns ABI/model tests, real VM entry on the active
  # hardware backend, snapshot sessions, dirty logging, and startup staging.
  # Device-model state belongs to the Alpine/5BSD checkpoint cases below.
  # Keep this exclusive and before every VM case because it replaces vmm.ko.
  - id: vmm-root
    executor: vmm-root
    profiles: [vmm-root]
    timeout: 1800
    exclusive: true
    gate: true
    resources: [compiler, vmm-module]

  # Exercise production scatter/gather construction in the running kernel.
  # These cases reproduce the physically-adjacent request/response collapse
  # that ordinary host-model tests cannot create deterministically.
  - id: kernel-contract-root
    executor: kernel-contract-root
    profiles: [kernel-root]
    timeout: 300
    exclusive: true
    gate: true
    resources: [compiler, kernel-module]

  # Nested architectural models must be accompanied by a clean build of the
  # production kernel module that will execute them.  Keep this VM-free so a
  # compiler or linker regression fails before the four-hour hardware case.
  - id: vmm-module-build
    executor: vmm-module-build
    profiles: [vmfree, nested, nested-default]
    timeout: 900
    exclusive: true
    gate: true
    resources: [compiler]

  # Exercise the independently built, sanitizer-capable nested architectural
  # model before a root-only hardware run.  This is intentionally not a
  # substitute for `nested-vmx-live`: the model validates state and ABI
  # contracts only, while the live case validates Intel VMX execution.
  - id: vmfree-nested-vmx-model
    executor: nested-vmx-model
    profiles: [vmfree, smoke, nested, nested-default]
    timeout: 1800
    exclusive: true
    gate: true
    resources: [compiler]

  # Compile and execute the same pointer-free state/ABI model under both
  # AddressSanitizer and UndefinedBehaviorSanitizer in an isolated object
  # tree.  It is a separate case so resume can retain the ordinary model
  # evidence when only sanitizer instrumentation or toolchain behavior
  # changes.  As above, neither result exposes VMX to an L1 guest.
  - id: vmfree-nested-vmx-model-sanitized
    executor: nested-vmx-model
    profiles: [vmfree, smoke, nested, nested-default]
    timeout: 3600
    exclusive: true
    gate: true
    resources: [compiler]
    env:
      SANITIZERS: address,undefined

  # Hardware qualification is deliberately a separate profile while nested
  # VMX remains default-off.  The reviewed L1 driver must boot the pinned
  # Linux/KVM L1 twice, once for each L2 operating system, and publish all twelve
  # feature-group assertions through the strict evidence contract.
  - id: nested-vmx-live
    executor: nested-vmx-live
    profiles: [nested]
    timeout: 14400
    exclusive: true
    gate: true
    resources: [compiler, nested-vmx]
    env:
      NESTED_VMX_LIVE_GATE: "yes"
      NESTED_VPID_QUALIFICATION: "1"
      NESTED_LIVE_TIMEOUT: "13800"

  # The loader-only VPID policy cannot be zero and one in the same boot.
  # Preserve this default-off proof as its own immutable result transaction.
  - id: nested-vmx-default-policy-live
    executor: nested-vmx-live
    profiles: [nested-default]
    timeout: 14400
    exclusive: true
    gate: true
    resources: [compiler, nested-vmx]
    env:
      NESTED_VMX_DEFAULT_POLICY_GATE: "yes"
      NESTED_VPID_QUALIFICATION: "0"
      NESTED_LIVE_TIMEOUT: "13800"

  # The immutable base image is copied sparsely per transport.  The resource
  # lock keeps concurrent attempts from racing while reading or validating it.
  - id: fivebsd-virtio
    executor: fivebsd-auto
    profiles: [release]
    timeout: 3600
    resources: [fivebsd-image]
    env:
      GUEST_OS: 5bsd
      TRANSPORTS: "modern legacy"
      FIVEBSD_BLOCK_QUEUES: "1"
      VM_FREE_GATES: "no"

  - id: fivebsd-balloon-packed
