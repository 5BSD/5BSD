# These settings change the VirtIO-visible behavior or a lifecycle contract.
# Every entry must be the variable of a release coverage contract.  Host
# resource identities such as SOUND_PLAY and SOUND_RECORD remain allowed
# overrides, but the SOUND_BACKEND contract covers their observable backend
# class; arbitrary local pathnames are not a finite behavior domain.
behavior_overrides:
  - DEVICES
  - TRANSPORTS
  - VSOCK_BACKEND
  - VIRTIO_MSIX
  - RESET_TEST
  - REBOOT_TEST
  - CHECKPOINT_TEST
  - BLOCK_QUEUES
  - NET_QUEUES
  - NET_PACKED
  - SCSI_QUEUES
  - RNG_PACKED
