# A release profile must demonstrate every value in these public test/device
# option domains.  Adding an exported option requires adding a contract here
# and cases which cover its meaningful boundaries.
coverage:
  - id: nested-vmx-default-policy-live-gate
    profiles: [nested-default]
    variable: NESTED_VMX_DEFAULT_POLICY_GATE
    values: ["yes"]
  - id: nested-vmx-live-gate
    profiles: [nested]
    variable: NESTED_VMX_LIVE_GATE
    values: ["yes"]
  - id: guest-operating-systems
    profiles: [release]
    variable: GUEST_OS
    values: [alpine, 5bsd]
  - id: devices
    profiles: [release]
    variable: DEVICES
    values: [net, vsock, rng, crypto, balloon, rtc, block, scsi, console, 9p, fs, input, gpu, mem, pmem, sound]
  - id: iommu-fabric
    profiles: [release]
    variable: VIRTIO_IOMMU
    selector: { TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: iommu-ring-formats
    profiles: [release]
    variable: IOMMU_PACKED
    selector: { VIRTIO_IOMMU: "yes", TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: iommu-endpoint-devices
    profiles: [release]
    variable: DEVICES
    tokens: true
    selector: { VIRTIO_IOMMU: "yes", TRANSPORTS: modern }
    values: [net, vsock, rng, rtc, block, scsi, console, 9p, fs, input, gpu, mem, sound]
  - id: pci-transports
    profiles: [release]
    variable: TRANSPORTS
    values: [modern, legacy]
  - id: interrupt-modes
    profiles: [release]
    variable: VIRTIO_MSIX
    selector: { DEVICES: net, TRANSPORTS: modern }
    values: ["yes", "no"]
  - id: net-queue-boundaries
    profiles: [release]
    variable: NET_QUEUES
    selector: { DEVICES: net, TRANSPORTS: modern }
    values: ["1", "2", "8"]
  - id: fivebsd-net-multiqueue
    profiles: [release]
    variable: FIVEBSD_NET_QUEUES
    selector:
      GUEST_OS: 5bsd
      FIVEBSD_NET_TEST: "yes"
      TRANSPORTS: modern
    values: ["2"]
  - id: fivebsd-net-testing
    profiles: [release]
    variable: FIVEBSD_NET_TEST
    selector: { GUEST_OS: 5bsd }
    values: ["no", "yes"]
  - id: fivebsd-net-ring-formats
    profiles: [release]
    variable: FIVEBSD_NET_PACKED
    selector:
      GUEST_OS: 5bsd
      FIVEBSD_NET_TEST: "yes"
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-block-ring-formats
    profiles: [release]
    variable: FIVEBSD_BLOCK_PACKED
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-block-multiqueue
    profiles: [release]
    variable: FIVEBSD_BLOCK_QUEUES
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["1", "2"]
  - id: fivebsd-block-discard
    profiles: [release]
    variable: FIVEBSD_BLOCK_DISCARD
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-block-write-zeroes-toggle
    profiles: [release]
    variable: FIVEBSD_BLOCK_WRITE_ZEROES
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    # WRITE_ZEROES is deliberately opt-in.  Its absent value is the normal
    # DISCARD-only baseline exercised by the ordinary 5BSD block lanes; the
    # distinct release obligation is the enabled sysctl transition and wire
    # type-13 request below.
    values: ["yes"]
  - id: fivebsd-block-readonly
    profiles: [release]
    variable: FIVEBSD_BLOCK_READONLY
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-block-wce
    profiles: [release]
    variable: FIVEBSD_BLOCK_WCE
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-scsi-multiqueue
    profiles: [release]
    variable: FIVEBSD_SCSI_QUEUES
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["0", "2"]
  - id: fivebsd-scsi-ring-formats
    profiles: [release]
    variable: FIVEBSD_SCSI_PACKED
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
      FIVEBSD_SCSI_QUEUES: "2"
    values: ["no", "yes"]
  - id: fivebsd-scsi-asynchronous-events
    profiles: [release]
    variable: FIVEBSD_SCSI_EVENTS
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
      FIVEBSD_SCSI_QUEUES: "2"
    values: ["no", "yes"]
  - id: fivebsd-rng-ring-formats
    profiles: [release]
    variable: FIVEBSD_RNG_PACKED
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-vsock-ring-formats
    profiles: [release]
    variable: FIVEBSD_VSOCK_PACKED
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-notification-data
    profiles: [release]
    variable: FIVEBSD_NOTIFICATION_DATA
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-rng-selective-reset
    profiles: [release]
    variable: FIVEBSD_RNG_RESET_ITERATIONS
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["0", "10"]
  - id: fivebsd-device-suspend
    profiles: [release]
    variable: FIVEBSD_DEVICE_SUSPEND
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-console-testing
    profiles: [release]
    variable: FIVEBSD_CONSOLE_TEST
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-console-ring-formats
    profiles: [release]
    variable: FIVEBSD_CONSOLE_PACKED
    selector:
      GUEST_OS: 5bsd
      FIVEBSD_CONSOLE_TEST: "yes"
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-console-port-counts
    profiles: [release]
    variable: FIVEBSD_CONSOLE_PORTS
    selector:
      GUEST_OS: 5bsd
      FIVEBSD_CONSOLE_TEST: "yes"
      TRANSPORTS: modern
    values: ["1", "2"]
  - id: fivebsd-balloon-ring-formats
    profiles: [release]
    variable: BALLOON_PACKED
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-balloon-target-boundaries
    profiles: [release]
    variable: BALLOON_TARGET_MB
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["1", "64"]
  - id: fivebsd-balloon-statistics
    profiles: [release]
    variable: FIVEBSD_BALLOON_STATS_INTERVAL
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["0", "1"]
  - id: fivebsd-balloon-deflate-on-oom
    profiles: [release]
    variable: FIVEBSD_BALLOON_DEFLATE_ON_OOM
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
    values: ["no", "yes"]
  - id: fivebsd-balloon-page-poison
    profiles: [release]
    variable: FIVEBSD_BALLOON_PAGE_POISON
    selector:
      GUEST_OS: 5bsd
      TRANSPORTS: modern
      FIVEBSD_BALLOON_DEFLATE_ON_OOM: "yes"
    values: ["no", "yes"]
  - id: fivebsd-gpu-testing
    profiles: [release]
    variable: FIVEBSD_GPU_TEST
    selector: { GUEST_OS: 5bsd, TRANSPORTS: modern }
    values: ["no", "yes"]
  - id: fivebsd-gpu-ring-formats
    profiles: [release]
    variable: FIVEBSD_GPU_PACKED
