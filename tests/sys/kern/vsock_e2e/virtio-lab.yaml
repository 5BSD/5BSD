  env:
    TRANSPORTS: modern
    VIRTIO_MSIX: "yes"
    RESET_TEST: "no"
    REBOOT_TEST: "no"
    CHECKPOINT_TEST: "no"
    VM_FREE_GATES: "no"
    VIRTIO_IOMMU: "no"
    IOMMU_PACKED: "no"
    SOUND_PACKED: "no"
    SOUND_BACKEND: "null"
    SOUND_PLAY: "/dev/dsp"
    SOUND_RECORD: "/dev/dsp"
    FS_PACKED: "no"
    FS_QUEUES: "2"
    FIVEBSD_NET_TEST: "no"
    FIVEBSD_NET_QUEUES: "2"
    FIVEBSD_NET_PACKED: "no"
    FIVEBSD_BLOCK_PACKED: "no"
    FIVEBSD_BLOCK_QUEUES: "1"
    FIVEBSD_BLOCK_DISCARD: "no"
    FIVEBSD_BLOCK_READONLY: "no"
    FIVEBSD_BLOCK_WCE: "no"
    FIVEBSD_SCSI_QUEUES: "0"
    FIVEBSD_SCSI_PACKED: "no"
    FIVEBSD_SCSI_EVENTS: "no"
    FIVEBSD_RNG_PACKED: "no"
    FIVEBSD_VSOCK_PACKED: "no"
    FIVEBSD_NOTIFICATION_DATA: "no"
    FIVEBSD_RNG_RESET_ITERATIONS: "0"
    FIVEBSD_DEVICE_SUSPEND: "no"
    FIVEBSD_CONSOLE_TEST: "no"
    FIVEBSD_CONSOLE_PACKED: "no"
    FIVEBSD_CONSOLE_PORTS: "1"
    FIVEBSD_BALLOON_STATS_INTERVAL: "0"
    FIVEBSD_BALLOON_DEFLATE_ON_OOM: "no"
    FIVEBSD_BALLOON_PAGE_POISON: "no"
    FIVEBSD_GPU_TEST: "no"
    FIVEBSD_GPU_PACKED: "no"
    FIVEBSD_GPU_WIDTH: "1024"
    FIVEBSD_GPU_HEIGHT: "768"
    FIVEBSD_RTC_TEST: "no"
    FIVEBSD_RTC_PACKED: "no"
    FIVEBSD_INPUT_TEST: "no"
    FIVEBSD_INPUT_PACKED: "no"
    FIVEBSD_INPUT_DEVICES: "1"
    FIVEBSD_NINEP_TEST: "no"
    FIVEBSD_NINEP_PACKED: "no"
    FIVEBSD_SOUND_TEST: "no"
    FIVEBSD_SOUND_PACKED: "no"
    FIVEBSD_MEM_TEST: "no"
    FIVEBSD_PMEM_TEST: "no"
    FIVEBSD_IOMMU_TEST: "no"
    CONSOLE_MULTIPORT: "no"
    CHECKPOINT_ACTIVE_9P_REJECT: "no"
    CHECKPOINT_ACTIVE_FS: "no"
    CHECKPOINT_REPEAT_FS_RESTORE: "no"
    CHECKPOINT_ACTIVE_VSOCK_REJECT: "no"
    CHECKPOINT_ACTIVE_CONSOLE_REJECT: "no"
    CHECKPOINT_ACTIVE_MEM: "no"
    INPUT_DEVICES: "1"
    GPU_WIDTH: "1024"
    GPU_HEIGHT: "768"
    GPU_BLOB: "no"
    GPU_DISPLAY: "no"
    BALLOON_STATS_INTERVAL: "0"
    BALLOON_DEFLATE_ON_OOM: "no"
    BALLOON_FREE_PAGE_HINTING: "no"
    BALLOON_FREE_PAGE_REPORTING: "no"
    BALLOON_PAGE_POISON: "no"
    RTC_ALARM: "no"
    RTC_CHECKPOINT_ALARM_SECONDS: "20"
    MEM_REGION_MB: "256"
    MEM_REQUESTED_MB: "128"
    MEM_CHECKPOINT_ALLOC_MB: "0"
    PMEM_PACKED: "no"
    PMEM_IMAGE_MB: "64"
    PMEM_IDENTITY: "waspnest-pmem"
    VM_MEMORY_MB: "2048"
    SCSI_EVENTS: "no"
    NONVIRTIO_DEVICE: none
    NONVIRTIO_CHECKPOINT: "no"
    NONVIRTIO_IMAGE_MB: "128"
    NONVIRTIO_HDA_PLAY: "/dev/dsp0"
    NONVIRTIO_HDA_RECORD: "/dev/dsp1"
    NONVIRTIO_TPM_TYPE: swtpm
    NONVIRTIO_TPM_PATH: ""
    NONVIRTIO_PASSTHRU: ""
    NONVIRTIO_PASSTHRU_GUEST_ASSERT: ""
    NONVIRTIO_PASSTHRU_LINUX_ASSERT: ""
    NONVIRTIO_PASSTHRU_FIVEBSD_ASSERT: ""
    # Internal coverage marker.  This is intentionally absent from
    # allowed_overrides: only the reviewed nested hardware case may satisfy
    # the full-qualification nested-VMX coverage contract.
    NESTED_VMX_LIVE_GATE: "no"
    # A separate boot proves the VPID qualification policy remains off.
    NESTED_VMX_DEFAULT_POLICY_GATE: "no"

# Qualification is the definition-of-done profile.  Profile composition keeps
# every release, checkpoint, and soak case authoritative in one place and
# de-duplicates cases that belong to more than one constituent profile.
profile_groups:
  qualification: [kernel-root, vmm-root, release, checkpoint, soak, nonvirtio]
  intel-qualification: [kernel-root, vmm-root, release, checkpoint, soak, nonvirtio, nested]
  audio-qualification: [audio, checkpoint-audio]
  # One explicit promotion gate for the Intel development host.  It also
  # includes the non-VirtIO software and operator-supplied hardware matrix;
  # portable and audio-only hosts retain the narrower profiles above.
  full-qualification: [kernel-root, vmm-root, release, checkpoint, soak, nonvirtio, nested, audio, checkpoint-audio]

# Deliberate command-line API for `--set`.  Allocation variables are included
# for single-case debugging, but the orchestrator rejects global allocation
# overrides when --jobs is greater than one.
allowed_overrides:
  - BHYVE
  - BHYVECTL
  - UEFI
  - SRCTOP
  - OBJROOT
  - TOOLS
  - TRANSPORTS
  - DEVICES
  - VSOCK_BACKEND
  - CID
  - CID1
  - CID2
  - PORT_OFFSET
  - PORT_OFFSET1
  - PORT_OFFSET2
  - CONSOLE_PORT
