# VM-only bsdinstall script input; never run against a host disk.
[ "$(geom disk list vtbd0 | awk '/ident:/ {print $2}')" = sw-installer-target ] || exit 1
if gpart show vtbd0 >/dev/null 2>&1; then
 echo 'Installer fixture requires an empty target disk' >&2
 exit 1
fi
export nonInteractive=YES
export ZFSBOOT_DISKS=vtbd0
export ZFSBOOT_POOL_NAME=policyvm
export ZFSBOOT_BOOT_TYPE=BIOS
export ZFSBOOT_PARTITION_SCHEME=GPT
export ZFSBOOT_CONFIRM_LAYOUT=
export ZFSBOOT_SWAP_SIZE=0
export ZFSBOOT_DATASETS='
 /ROOT mountpoint=none
 /ROOT/default mountpoint=/
 /tmp mountpoint=/tmp,exec=on,setuid=off
'
export COMPONENTS='base tests'
#!/bin/sh
set -eu
# This section runs inside the installed root, through bsdinstall's setup hook.
sysrc hostname=auth-policy-vm zfs_enable=YES sshd_enable=NO sendmail_enable=NONE devmatch_enable=NO
pw useradd -n policyuser -u 2001 -m -s /bin/sh
printf '%s\n' policy-vm-only | pw usermod policyuser -h 0
printf '%s\n' policy-vm-only | pw usermod root -h 0
cat > /etc/ttys <<'TTYS'
ttyu0 "/usr/libexec/getty policy" vt100 on secure
TTYS
cat >> /etc/gettytab <<'GETTY'

policy|Policy VM console:\
 :al=root:tc=3wire:
GETTY
cat >> /boot/loader.conf <<'LOADER'
console="comconsole"
autoboot_delay="1"
init_path="/sbin/capsule"
zfs_load="YES"
dtraceall_load="YES"
LOADER
cat > /root/.profile <<'PROFILE'
case "$-" in *i*) ;; *) return ;; esac
printf '%s\n' SOFTWARE_INSTALLED_ROOT_BOOTED
PROFILE
# root's login shell is zsh, which reads .zprofile rather than .profile.
printf '%s\n' "emulate sh -c '. /root/.profile'" > /root/.zprofile
[ ! -e /Capabilities/System/Auth.cap ]
[ ! -e /usr/bin/anoint ]
pkg query '%n %v' > /root/installed-packages.txt
printf '%s\n' SOFTWARE_BSDINSTALL_SETUP_PASS
