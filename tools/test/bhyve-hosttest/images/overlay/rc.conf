# hosttest guest rc.conf. Role, hostname and address come from the loader
# environment set by bhyveload -e (hosttest.*), read with kenv(1).
hostname="$(/bin/kenv -q hosttest.hostname 2>/dev/null || echo htguest)"
sendmail_enable="NONE"
sshd_enable="NO"
cron_enable="NO"
syslogd_flags="-ss"
dumpdev="NO"
background_fsck="NO"
fsck_y_enable="YES"
_ht_addr="$(/bin/kenv -q hosttest.inet 2>/dev/null)"
[ -n "$_ht_addr" ] && ifconfig_vtnet0="inet $_ht_addr"
# HyperTrace guest daemon (minion) when the role asks for it.
case "$(/bin/kenv -q hosttest.dtraced 2>/dev/null)" in
yes) dtraced_enable="NO" ;; # rc.local captures the foreground minion
esac

# Record the rc script/command responsible for a slow capability-plane boot.
rc_debug="YES"
